# Desk copilot v1 configuration. Paper trading only.
# Every number here is a hard limit enforced in code (deskbot/risk.py), not a hint to the model.

[paper]
starting_cash_usd = 1000.0
db_path = "deskbot.sqlite3"
# Fixed cost charged on every paper fill to stand in for priority fee + Jito tip + base fee.
network_fee_usd = 0.02

[loop]
interval_minutes = 15
# Approval mode: "manual" asks y/n in the terminal for every trade that passes risk; "auto" fills on risk pass.
approve = "manual"
# Optional free-text file you edit by hand (news you read, levels you care about). Sent to Grok each cycle.
notes_path = "notes.md"

[grok]
temperature = 0.2
# Let Grok search X for the allowlisted tickers before answering. Costs extra tool calls per cycle.
x_search = false
# Restrict X search to these handles (without @). Empty = no restriction.
x_handles = []

[risk]
max_trades_per_day = 6
max_position_usd = 150.0
max_gross_exposure_usd = 500.0
min_trade_usd = 10.0
min_confidence = 0.6
slippage_bps = 50
# Proposed edge must exceed (price impact + slippage + network fee) by this multiple.
edge_cost_multiple = 2.0
# Minimum minutes between two fills on the same mint (anti-churn).
mint_cooldown_minutes = 60
# Halt new trades for the UTC day once equity is this far below the day's opening equity.
daily_loss_limit_usd = 50.0
# Halt after this many consecutive cycles that failed to fetch data or parse the model.
max_consecutive_errors = 3
# Safety screen thresholds (applied to every token; trusted tokens skip only the authority checks).
max_top_holders_pct = 40.0
min_liquidity_usd = 25000.0
require_lp_burned = false
max_price_impact_bps = 200.0
take_profit_pct = 15.0
stop_loss_pct = 7.0
max_hold_hours = 4.0
# Creating a file with this name in the working directory halts trading immediately.
kill_switch_file = "STOP"

# The quote asset. Capital and cash are held in SOL (Wrapped SOL).
[quote]
symbol = "SOL"
mint = "So11111111111111111111111111111111111111112"
decimals = 9

# Active traded tokens against SOL.
# trusted_authorities = true means the issuer legitimately keeps a mint or freeze authority.
# For DEX tokens / meme coins, leave false so freeze & mint authorities must be revoked.
[[tokens]]
symbol = "JUP"
mint = "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN"
decimals = 6
trusted_authorities = false

