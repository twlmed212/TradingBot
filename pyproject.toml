[project]
name = "deskbot"
version = "0.1.0"
description = "Paper-trading Solana desk copilot: Grok proposes, a deterministic risk engine gates, Jupiter quotes fill."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deskbot = "deskbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
