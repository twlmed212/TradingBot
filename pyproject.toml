[project]
name = "solana-swapbot"
version = "0.1.0"
description = "Non-custodial Solana swap bot that earns a per-trade fee through Jupiter's Referral Program."
requires-python = ">=3.12"
dependencies = []  # swapbot uses the standard library; boto3 comes with the AWS Lambda runtime

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["swapbot/tests"]
